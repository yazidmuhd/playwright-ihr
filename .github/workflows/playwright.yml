name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * *' # daily, picks up the latest i-HR code
  workflow_dispatch:
    inputs:
      ihr_ref:
        description: i-HR branch, tag or commit to test
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IHR_REPOSITORY: yazidmuhd/ihr
  IHR_REF: ${{ inputs.ihr_ref || 'main' }}

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ihr_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      IHR_APP_DIR: ihr
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      IHR_DB_DATABASE: ihr_e2e

    steps:
      - uses: actions/checkout@v7

      # The application under test
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.IHR_REPOSITORY }}
          ref: ${{ env.IHR_REF }}
          path: ihr
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, gd, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ihr/package-lock.json
      - name: Install and build i-HR
        working-directory: ihr
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      # The tests
      - run: npm ci
      # The HR sign-in setup step always runs in Chromium, so every job needs it as well
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob,github
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}.zip
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

  report:
    name: Combined HTML report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: playwright-report

  # Publishes the latest report from main at https://yazidmuhd.github.io/playwright-ihr/
  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
